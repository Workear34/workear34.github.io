  <script>window.__HEXO_DATA__ = {"config":{"blogName":"沃克尔试验场","welcome":{"title":"","description":""},"menu":{"Home":"/","About":"/about","Contact":"/contact"},"about":{"title":"","intro":"","features":[],"techStack":[]},"contact":{"email":"","phone":"","address":""}},"posts":[{"id":"Dolphin 模拟器提升画质","title":"巧妙通过 Dolphin 模拟器自定义纹理加载功能 + Waifu2x-Extension-GUI 提升 GameCube/Wii 游戏画质","date":"2026-07-25","readTime":"6 分钟","tags":["模拟器","AI图片放大","游戏"],"tag":"模拟器","tagType":"default","summary":"<p>Dolphin 模拟器本身支持高清渲染，但由于游戏发行年代太久远、加上光盘容量大小限制等因素，游戏本身贴图的分辨率普遍较低。导致在高分辨率渲染下，贴图本身会显得模糊不清。你玩游戏时，虽然分辨率本身是高了，但游戏看起来还是很糊。<br>但，我们可以巧妙借助 Dolphin 模拟器的提取游戏贴图功能 + 自定义纹理加载功能，和当下已成熟的 AI 图像无损放大技术，先设法提高游戏的贴图质量，再让模","content":"<p>Dolphin 模拟器本身支持高清渲染，但由于游戏发行年代太久远、加上光盘容量大小限制等因素，游戏本身贴图的分辨率普遍较低。导致在高分辨率渲染下，贴图本身会显得模糊不清。你玩游戏时，虽然分辨率本身是高了，但游戏看起来还是很糊。<br>但，我们可以巧妙借助 Dolphin 模拟器的提取游戏贴图功能 + 自定义纹理加载功能，和当下已成熟的 AI 图像无损放大技术，先设法提高游戏的贴图质量，再让模拟器加载这些处理过的高清贴图，从而达到提升画质的目的。<br>经过个人实测，此方法不仅效果显著，而且操作方法也较为简单。可以试一下。</p>\n<h2 id=\"核心原理\"><a href=\"#核心原理\" class=\"headerlink\" title=\"核心原理\"></a>核心原理</h2><ol>\n<li>让 Dolphin 模拟器在游戏运行时将游戏使用的原始贴图文件提取出来，并打开其所在文件夹。</li>\n<li>使用 AI 图像放大软件处理这些提取出的贴图，提升其分辨率与细节，并自动将放大后的高清贴图放回至Dolphin加载自定义纹理的文件夹。</li>\n<li>让Dolphin模拟器在游戏运行时将加载这些高清贴图，提升游戏画质。</li>\n</ol>\n<h2 id=\"所需工具\"><a href=\"#所需工具\" class=\"headerlink\" title=\"所需工具\"></a>所需工具</h2><ul>\n<li>Dolphin模拟器（本文使用截止到写作时的最新正式版<code>2506a</code>）</li>\n<li>你想要提升画质的游戏</li>\n<li>AI图像放大软件：例如 Waifu2x-Extension-GUI，Topaz Gigapixel AI 等。本教程以  Waifu2x-Extension-GUI 为例。</li>\n<li>一台性能较高的电脑（AI 图像放大软件比较吃电脑硬件）</li>\n</ul>\n<h2 id=\"详细步骤\"><a href=\"#详细步骤\" class=\"headerlink\" title=\"详细步骤\"></a>详细步骤</h2><h3 id=\"第一阶段：提取游戏内的贴图\"><a href=\"#第一阶段：提取游戏内的贴图\" class=\"headerlink\" title=\"第一阶段：提取游戏内的贴图\"></a>第一阶段：提取游戏内的贴图</h3><ol>\n<li>打开 Dolphin 模拟器。</li>\n<li>启用纹理转储与加载功能<ul>\n<li>点击顶部菜单栏的图形，打开<code>图形配置</code>。</li>\n<li>切换到<code>高级</code>标签页。</li>\n<li>在<code>实用功能</code>部分，勾选“加载自定义纹理”（建议提前勾选）。</li>\n<li>在<code>转储纹理</code>部分，勾选<code>启用</code>、<code>转储基本纹理</code>、<code>转储Mip映射</code>。<strong>必须全部勾选</strong>，否则模拟器将不会提取贴图，或者提取的贴图很少。</li>\n</ul>\n</li>\n<li>开始提取贴图<br>运行你想要提升画质的游戏，然后向往常一样游玩一段时间。在这期间<strong>尽可能打开更多的关卡、角色、地图、菜单等</strong>，好让模拟器提取尽可能多的贴图<br>因为 Dolphin 模拟器提取贴图的原理本质上是将加载到内存中的纹理存到硬盘上，因此它只会提取加载到内存中的贴图。换句话说，玩得越深入，提取的贴图越全。</li>\n<li>获取游戏ID<ul>\n<li>关闭游戏，在Dolphin主界面的游戏列表中，右键点击你刚才玩的游戏，选择<code>属性</code>。</li>\n<li>在弹出窗口中，找到<code>游戏ID</code>一栏（格式一般为四个大写字母 + 数字，例如 <code>GALE01</code>, <code>RMCP01</code>）。<strong>一定要记下这个游戏 ID</strong>，后面要用到。</li>\n</ul>\n</li>\n</ol>\n<h3 id=\"第二阶段：找到提取的贴图\"><a href=\"#第二阶段：找到提取的贴图\" class=\"headerlink\" title=\"第二阶段：找到提取的贴图\"></a>第二阶段：找到提取的贴图</h3><ol>\n<li>点击顶部菜单栏的<code>文件</code>→<code>打开用户文件夹</code>。</li>\n<li>找到转储的贴图<ul>\n<li>在打开的文件夹中，进入 <code>Dump</code> 文件夹，再进入 <code>Textures</code> 文件夹。</li>\n<li>找到并进入你在<strong>第一阶段步骤 4</strong>记录下的那个名字为<code>游戏 ID</code>的文件夹。</li>\n<li>打开后，你会看到里面存放着许多文件名为一堆随机英文字母的图片文件，这些就是 Dolphin 从游戏中提取出来的贴图。<del>别被这些英文字符吓到了，它们的名字其实不重要。</del></li>\n</ul>\n</li>\n</ol>\n<h3 id=\"第三阶段：使用Waifu2x-Extension-GUI图像放大软件放大纹理\"><a href=\"#第三阶段：使用Waifu2x-Extension-GUI图像放大软件放大纹理\" class=\"headerlink\" title=\"第三阶段：使用Waifu2x-Extension-GUI图像放大软件放大纹理\"></a>第三阶段：使用Waifu2x-Extension-GUI图像放大软件放大纹理</h3><ol>\n<li>关闭模拟器，打开 Waifu2x-Extension-GUI。</li>\n<li>将你在<strong>第二阶段步骤 2</strong>中找到的<strong>整个游戏ID文件夹</strong>（位于 <code>用户文件夹\\Dump\\Textures</code> 下）直接拖拽到软件界面中。软件会自动添加该文件夹内的所有贴图到处理队列。</li>\n<li>设置图片输出目录（关键步骤）<ul>\n<li>在 Dolphin 用户文件夹中（<strong>第二阶段步骤 2</strong>打开的文件夹），进入<code>Load</code> → <code>Textures</code>文件夹。复制这个文件夹的完整路径（例如 <code>C:\\Users\\YourName\\Documents\\Dolphin Emulator\\Load\\Textures</code>）。</li>\n<li>返回Waifu2x-Extension-GUI，找到<code>输出文件夹</code>设置项。将输出文件夹设置为刚才复制的路径。</li>\n<li>在软件<code>输出文件夹</code>下面的选项中勾选<code>启用</code>、<code>保留原文件名</code>、<code>保留上级文件夹</code>、<code>自动创建输出文件夹</code>（<strong>必须全部勾选</strong>，确保提升后的贴图文件名与原贴图文件名一致，且放在了正确的目录中，否则模拟器有可能不会加载提升后的高清贴图）。</li>\n<li>将软件中<code>将静态图片保存为</code>中的格式改为<code>PNG</code>（<strong>必须更改</strong>，确保与原始转储格式一致，Dolphin模拟器提取出来的贴图文件格式均为<code>PNG</code>）。</li>\n</ul>\n</li>\n<li>选择合适的放大倍数（例如2x, 4x）、放大模型（例如 Waifu2x-NCNN-Vulkan），并调整质量等相关参数（这里建议参考官方软件教程，不会的话保持默认即可）。</li>\n<li>确认无误后，点击<code>开始</code>按钮（这里可能会很耗时，一定要耐心等待）。</li>\n</ol>\n<h3 id=\"第四阶段：让模拟器加载高清贴图\"><a href=\"#第四阶段：让模拟器加载高清贴图\" class=\"headerlink\" title=\"第四阶段：让模拟器加载高清贴图\"></a>第四阶段：让模拟器加载高清贴图</h3><ol>\n<li>确认高清贴图的位置<ul>\n<li>处理完成后，打开你设置的输出目录，确认里面已经自动创建了一个以你的<code>游戏ID</code>命名的文件夹。</li>\n<li>进入该文件夹，检查里面是否包含了放大后的图片文件，以及文件名应与原始转储文件完全一致。</li>\n</ul>\n</li>\n<li>让 Dolphin 模拟器加载高清贴图<ul>\n<li>再次打开Dolphin模拟器</li>\n<li>再次点击“图形”→“设置”→“高级”标签页。</li>\n<li>找到“转储纹理”部分，取消勾选“启用”。</li>\n<li>在“实用功能”部分，确认“加载自定义纹理”已经勾选。</li>\n</ul>\n</li>\n<li>再次运行你刚才游玩的游戏。</li>\n<li>Enjoy it!</li>\n</ol>\n<h2 id=\"注意事项与说明\"><a href=\"#注意事项与说明\" class=\"headerlink\" title=\"注意事项与说明\"></a>注意事项与说明</h2><h3 id=\"此方法的优势\"><a href=\"#此方法的优势\" class=\"headerlink\" title=\"此方法的优势\"></a>此方法的优势</h3><ul>\n<li>能有效提升游戏中静态贴图的画质（角色、环境、物品贴图、UI元素、字体等），尤其是对于2D动漫风格的游戏（其画面主要以贴图为主）。</li>\n<li>不只限于GameCube&#x2F;Wii游戏，模拟器支持的带有图形界面的应用也可以提升其画质（例如Wii频道、WiiWare等）。</li>\n<li>操作较为简单，无需解包游戏源文件，也无需重新绘制、寻找高清贴图。</li>\n</ul>\n<h3 id=\"此方法的局限性\"><a href=\"#此方法的局限性\" class=\"headerlink\" title=\"此方法的局限性\"></a>此方法的局限性</h3><ul>\n<li>只能提升提取出来的游戏贴图的画质，无法提升游戏中的其他动态元素（如模型粒子特效、动态光影、后期处理效果等）、多边形模型复杂度、音频质量或过场动画视频的画质。</li>\n<li>AI放大虽已成熟但并非完美，可能会出现一些伪影（如过度锐化、涂抹感、奇怪的纹理细节、颜色偏差等），且贴图的原始分辨率越低，AI放大的效果就越差。同时，不同AI软件和模型对最终贴图的清晰度、细节保留度等影响显著。</li>\n<li>AI软件放大大量贴图对CPU&#x2F;GPU要求较高，处理时间可能很长。性能较弱的电脑可以降低放大倍率或质量，但效果会打折扣。</li>\n<li>AI还可能有小概率会生成错误的贴图，导致游戏画面渲染出现错误。需要你手动排查错误贴图并将其替换。</li>\n<li>Dolphin模拟器只会转储游戏运行时加载到内存的贴图。这意味着你未探索到的区域、未解锁的角色&#x2F;物品的贴图都不会被提取。当你进入这些区域时，游戏仍会显示部分原始贴图，从而导致画面产生割裂感。</li>\n</ul>\n<h2 id=\"常见问题排查\"><a href=\"#常见问题排查\" class=\"headerlink\" title=\"常见问题排查\"></a>常见问题排查</h2><ol>\n<li>没有效果、不起作用<br>请按顺序检查：<ul>\n<li>在游玩之前是否已经勾选了<code>转储纹理</code>部分中的<code>启用</code>选项？</li>\n<li>模拟器的<code>加载自定义纹理</code>选项是否开启？</li>\n<li>高清贴图是否放到了正确的路径（<code>Load\\Textures\\对应的游戏ID</code>）？</li>\n<li>高清贴图的文件名是否与原始转储文件完全一致（包括图片格式）？</li>\n</ul>\n</li>\n<li>部分贴图仍为原始贴图、画面有“割裂感”<ul>\n<li>请确认模拟器是否已将你游玩部分的贴图全部提取，以及AI软件是否将其全部成功放大（通常是AI软件放大失败引起的）。</li>\n<li>Dolphin模拟器只会转储游戏运行时加载到内存的贴图，详细请见<strong>此方法的局限性</strong>。更彻底的方案是使用第三方工具解包游戏ROM，提取全部贴图并放大，再替换原有文件并重新打包，但此方法操作极为复杂（涉及到专有文件格式转换、加密ROM破解、文件重打包等知识），本教程不再赘述。</li>\n</ul>\n</li>\n<li>放大后的高清贴图有白边、非透明<ul>\n<li>检查你的AI放大软件\\模型是否支持透明图片放大（此问题通常不会出现，因为Waifu2x-Extension-GUI默认支持透明图片放大）。</li>\n</ul>\n</li>\n<li>放大后的高清贴图质量差<ul>\n<li>重新打开Waifu2x-Extension-GUI，按照上文步骤设置更高质量参数后重试。</li>\n<li>如果你对AI放大后的贴图效果实在不满意，也可以到网络上寻找玩家制作好的高清纹理包或者自行寻找或绘制高清贴图。具体操作需要你自行探索，本教程不再赘述。</li>\n</ul>\n</li>\n</ol>\n"},{"id":"hello-world","title":"Hello World","date":"2026-07-08","readTime":"3 分钟","tags":[],"tag":"","tagType":"default","summary":"<p>Welcome to <a href=\"https://hexo.io/\">Hexo</a>! This is your very first post. Check <a href=\"https://hexo.io/docs/\">documentation</a> for more info. If you get any problems when using Hexo, you can","content":"<p>Welcome to <a href=\"https://hexo.io/\">Hexo</a>! This is your very first post. Check <a href=\"https://hexo.io/docs/\">documentation</a> for more info. If you get any problems when using Hexo, you can find the answer in <a href=\"https://hexo.io/docs/troubleshooting.html\">troubleshooting</a> or you can ask me on <a href=\"https://github.com/hexojs/hexo/issues\">GitHub</a>.</p>\n<h2 id=\"Quick-Start\"><a href=\"#Quick-Start\" class=\"headerlink\" title=\"Quick Start\"></a>Quick Start</h2><h3 id=\"Create-a-new-post\"><a href=\"#Create-a-new-post\" class=\"headerlink\" title=\"Create a new post\"></a>Create a new post</h3><figure class=\"highlight bash\"><table><tr><td class=\"gutter\"><pre><span class=\"line\">1</span><br></pre></td><td class=\"code\"><pre><span class=\"line\">$ hexo new <span class=\"string\">&quot;My New Post&quot;</span></span><br></pre></td></tr></table></figure>\n\n<p>More info: <a href=\"https://hexo.io/docs/writing.html\">Writing</a></p>\n<h3 id=\"Run-server\"><a href=\"#Run-server\" class=\"headerlink\" title=\"Run server\"></a>Run server</h3><figure class=\"highlight bash\"><table><tr><td class=\"gutter\"><pre><span class=\"line\">1</span><br></pre></td><td class=\"code\"><pre><span class=\"line\">$ hexo server</span><br></pre></td></tr></table></figure>\n\n<p>More info: <a href=\"https://hexo.io/docs/server.html\">Server</a></p>\n<h3 id=\"Generate-static-files\"><a href=\"#Generate-static-files\" class=\"headerlink\" title=\"Generate static files\"></a>Generate static files</h3><figure class=\"highlight bash\"><table><tr><td class=\"gutter\"><pre><span class=\"line\">1</span><br></pre></td><td class=\"code\"><pre><span class=\"line\">$ hexo generate</span><br></pre></td></tr></table></figure>\n\n<p>More info: <a href=\"https://hexo.io/docs/generating.html\">Generating</a></p>\n<h3 id=\"Deploy-to-remote-sites\"><a href=\"#Deploy-to-remote-sites\" class=\"headerlink\" title=\"Deploy to remote sites\"></a>Deploy to remote sites</h3><figure class=\"highlight bash\"><table><tr><td class=\"gutter\"><pre><span class=\"line\">1</span><br></pre></td><td class=\"code\"><pre><span class=\"line\">$ hexo deploy</span><br></pre></td></tr></table></figure>\n\n<p>More info: <a href=\"https://hexo.io/docs/one-command-deployment.html\">Deployment</a></p>\n"}]};</script>
